spring:
  application:
    name: prueba-tecnica
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/products_db?currentSchema=qph_prueba}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 240000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: qph_prueba
    open-in-view: false
  sql:
    init:
      mode: "${DB_SCHEMA_INIT_MODE:never}"
      schema-locations: file:database/schema.sql

server:
  port: 8080

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}"
  jwt:
    secret: "${JWT_SECRET}"
    expiration: "${JWT_EXPIRATION:86400000}"
  bootstrap-admin:
    enabled: "${APP_BOOTSTRAP_ADMIN_ENABLED:false}"
    username: "${APP_BOOTSTRAP_ADMIN_USERNAME:}"
    password: "${APP_BOOTSTRAP_ADMIN_PASSWORD:}"

logging:
  file:
    name: "${LOG_FILE_PATH:logs/prueba-tecnica.log}"
  level:
    root: INFO
    com.example.demo: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSSXXX} %-5level --- [%thread] [%X{requestId}] %logger{36} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSSXXX} %-5level --- [%thread] [%X{requestId}] %logger{36} : %msg%n"
  logback:
    rollingpolicy:
      max-history: 365
