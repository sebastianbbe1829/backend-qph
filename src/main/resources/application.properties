spring.application.name=prueba-tecnica

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/products_db?currentSchema=qph_prueba}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=qph_prueba
spring.jpa.open-in-view=false

spring.sql.init.mode=${DB_SCHEMA_INIT_MODE:never}
spring.sql.init.schema-locations=file:database/schema.sql

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
